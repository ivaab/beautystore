<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27><rect width=%27100%27 height=%27100%27 rx=%2720%27 fill=%27black%27/><text x=%2750%27 y=%2772%27 text-anchor=%27middle%27 font-family=%27Arial, Helvetica, sans-serif%27 font-weight=%27800%27 font-size=%2764%27 fill=%27white%27>V</text></svg>">
    <title>Prijava - Vellure</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Poppins:wght@300;400;500;600;700&family=Playfair+Display:wght@500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- NAVBAR -->
    <div class="navbar">
        <a href="index.html" class="logo">Vellure</a>

        <form class="nav-search" id="navSearchForm">
            <input type="text" id="navSearchInput" placeholder="Pretraži kozmetiku...">
            <button type="submit" aria-label="Pretraga"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"></circle><line x1="20" y1="20" x2="15.5" y2="15.5"></line></svg></button>
        </form>

        <button class="nav-hamburger" id="navHamburger" aria-label="Izbornik">☰</button>

        <div class="nav-links">
            <a href="index.html">Početna</a>
            <a href="shop.html">Proizvodi</a>
            <a href="cart.html">Košarica</a>
            <a href="profile.html" id="profileLink" style="display:none;">Moj profil</a>
            <a href="users.html" id="usersLink" style="display:none;">Korisnici</a>
            <a href="login.html" id="loginLink" style="display:none;">Prijava</a>
            <a href="#" id="logoutBtn" style="display:none;">Odjava</a>
        </div>
    </div>

    <div class="auth-page-wrap">
        <div class="auth-container">

            <h2>Prijava</h2>

            <form id="loginForm">

                <label for="email">Email adresa</label>
                <input
                    type="email"
                    id="email"
                    placeholder="Unesi svoj email">
                <span class="field-error" id="emailError"></span>

                <label for="password">Lozinka</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Unesi svoju lozinku">
                <span class="field-error" id="passwordError"></span>

                <div class="auth-forgot-row">
                    <a href="#" id="forgotPasswordLink">Zaboravljena lozinka?</a>
                </div>

                <button type="submit" id="loginBtn">
                    Prijavi se
                </button>

            </form>

            <p>
                Nemaš račun?
                <a href="register.html">Registriraj se</a>
            </p>

        </div>
    </div>

    <script type="module" src="js/nav.js"></script>
    <script type="module" src="js/login.js"></script>

</body>
</html>
